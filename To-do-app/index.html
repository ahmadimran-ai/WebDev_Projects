<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
    <div class="app">

        <header>
            <h1><i class="fas fa-check-circle"></i> My Tasks</h1>
            <p id="date"></p>
        </header>

        <!-- INPUT -->
        <div class="todo-input">
            <div class="input-group">
                <input type="text" id="task-input" placeholder="Task title..." />
                <input type="text" id="task-desc" placeholder="Description (optional)..." />
            </div>

            <button id="add-task">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <span class="filter active" data-filter="all">All</span>
            <span class="filter" data-filter="active">Active</span>
            <span class="filter" data-filter="completed">Completed</span>
        </div>

        <!-- TODOS -->
        <div class="todos-container">
            <ul id="todos-list"></ul>

            <div class="empty-state hidden">
                <i class="fas fa-clipboard-list"></i>
                <p>No tasks yet</p>
            </div>
        </div>

        <!-- FOOTER -->
        <footer>
            <p id="items-left">0 items left</p>
            <button id="clear-completed">Clear completed</button>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
