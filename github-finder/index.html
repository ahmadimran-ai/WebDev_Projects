<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub User Finder</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
    <div class="container">

        <header>
            <h1><i class="fab fa-github"></i> GitHub User Finder</h1>
            <p>Search for any GitHub user</p>
        </header>

        <div class="search-container">
            <input type="text" id="search" placeholder="Enter GitHub username..." />
            <button id="search-btn">Search</button>
        </div>

        <div id="error-container" class="hidden">
            <p>User not found</p>
        </div>

        <div id="profile-container" class="hidden">

            <div class="profile-header">
                <img id="avatar" />

                <div class="profile-info">
                    <h2 id="name"></h2>
                    <p id="username"></p>
                    <p id="bio"></p>

                    <p>
                        📍 <span id="location"></span> |
                        📅 <span id="joined-date"></span>
                    </p>

                    <a id="profile-link" target="_blank" class="btn">View Profile</a>
                </div>
            </div>

            <div class="stats">
                <div><b id="followers"></b> Followers</div>
                <div><b id="following"></b> Following</div>
                <div><b id="repos"></b> Repos</div>
            </div>

            <div class="repos-section">
                <h3>Latest Repositories</h3>
                <div id="repos-container"></div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
